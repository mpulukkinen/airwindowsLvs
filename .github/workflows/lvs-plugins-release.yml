name: LVS Audio Suite - Windows Release

on:
  push:
    tags:
      - 'lvs-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S lvs-plugins -B build/lvs-plugins
          -G "Visual Studio 17 2022" -A x64
          -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build and validate Release
        run: cmake --build build/lvs-plugins --config Release --parallel

      - name: Package VST3 suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null

          $plugins = Get-ChildItem -Path build/lvs-plugins -Recurse -Directory -Filter 'LVS*.vst3' |
            Group-Object Name |
            ForEach-Object { $_.Group | Select-Object -First 1 } |
            Sort-Object Name

          if ($plugins.Count -ne 24) {
            Write-Host "Found $($plugins.Count) LVS VST3 bundles:"
            $plugins | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "Expected exactly 24 LVS VST3 bundles"
          }

          foreach ($plugin in $plugins) {
            Copy-Item -Path $plugin.FullName -Destination dist/package -Recurse
            Write-Host "Collected $($plugin.Name)"
          }

          Copy-Item -Path lvs-plugins/THIRD_PARTY_NOTICES.md -Destination dist/package
          Compress-Archive -Path dist/package/* -DestinationPath dist/LVS-Audio-Suite-Windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LVS-Audio-Suite-Windows-x64
          path: dist/LVS-Audio-Suite-Windows-x64.zip
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/LVS-Audio-Suite-Windows-x64.zip --clobber
          } else {
            gh release create $tag dist/LVS-Audio-Suite-Windows-x64.zip --generate-notes --title "LVS Audio Suite $tag"
          }
