name: LVS Audio Suite - Windows Release

on:
  push:
    branches:
      - master
    tags:
      - 'lvs-v*'
    paths:
      - '.github/LVS_RELEASE_TAG'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example lvs-v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
          } else {
            $tag = (Get-Content ".github/LVS_RELEASE_TAG" -Raw).Trim()
          }

          if ($tag -notmatch '^lvs-v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$tag'. Expected lvs-vMAJOR.MINOR.PATCH"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Create release tag
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $expected = "${{ github.sha }}"
          $existing = git ls-remote --tags origin "refs/tags/$tag"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query existing tag $tag"
          }

          if ($existing) {
            $actual = ($existing -split '\s+')[0]
            if ($actual -ne $expected) {
              throw "Tag $tag already exists at $actual instead of $expected"
            }
            Write-Host "Tag $tag already points at $expected"
          } else {
            git tag $tag $expected
            git push origin "refs/tags/$tag"
            Write-Host "Created tag $tag at $expected"
          }

      - name: Configure
        run: >-
          cmake -S lvs-plugins -B build/lvs-plugins
          -G "Visual Studio 17 2022" -A x64
          -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build and validate Release
        run: cmake --build build/lvs-plugins --config Release --parallel

      - name: Package VST3 suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null

          $plugins = Get-ChildItem -Path build/lvs-plugins -Recurse -Directory -Filter 'LVS*.vst3' |
            Group-Object Name |
            ForEach-Object { $_.Group | Select-Object -First 1 } |
            Sort-Object Name

          if ($plugins.Count -ne 24) {
            Write-Host "Found $($plugins.Count) LVS VST3 bundles:"
            $plugins | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "Expected exactly 24 LVS VST3 bundles"
          }

          foreach ($plugin in $plugins) {
            Copy-Item -Path $plugin.FullName -Destination dist/package -Recurse
            Write-Host "Collected $($plugin.Name)"
          }

          Copy-Item -Path lvs-plugins/THIRD_PARTY_NOTICES.md -Destination dist/package
          Compress-Archive -Path dist/package/* -DestinationPath dist/LVS-Audio-Suite-Windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LVS-Audio-Suite-Windows-x64
          path: dist/LVS-Audio-Suite-Windows-x64.zip
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = $tag -replace '^lvs-', ''

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/LVS-Audio-Suite-Windows-x64.zip --clobber
          } else {
            gh release create $tag dist/LVS-Audio-Suite-Windows-x64.zip --generate-notes --title "LVS Audio Suite $version"
          }
