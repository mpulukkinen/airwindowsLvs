name: LVS Audio Suite - Windows Build

on:
  push:
    branches:
      - master
    paths:
      - 'lvs-plugins/**'
      - '.github/workflows/lvs-plugins-build.yml'
  pull_request:
    paths:
      - 'lvs-plugins/**'
      - '.github/LVS_RELEASE_TAG'
      - '.github/workflows/lvs-plugins-build.yml'
      - '.github/workflows/lvs-plugins-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            pe_machine: '8664'
            artifact: LVS-Audio-Suite-Windows-x64
          - arch: arm64
            cmake_arch: ARM64
            pe_machine: 'AA64'
            artifact: LVS-Audio-Suite-Windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ${{ matrix.arch }}
        shell: pwsh
        run: |
          $args = @(
            '-S', 'lvs-plugins',
            '-B', 'build/lvs-plugins-${{ matrix.arch }}',
            '-G', 'Visual Studio 17 2022',
            '-A', '${{ matrix.cmake_arch }}',
            '-DSMTG_CREATE_PLUGIN_LINK=OFF'
          )

          # GitHub's Windows runner is x64. It can cross-compile ARM64 binaries,
          # but cannot execute Steinberg's ARM64 validator/moduleinfotool after build.
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $args += '-DSMTG_RUN_VST_VALIDATOR=OFF'
            $args += '-DSMTG_CREATE_MODULE_INFO=OFF'
          }

          & cmake @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release ${{ matrix.arch }}
        shell: pwsh
        run: |
          $buildRoot = 'build/lvs-plugins-${{ matrix.arch }}'
          if ('${{ matrix.arch }}' -eq 'arm64') {
            # Build only the product targets. Building ALL_BUILD would also build
            # Steinberg's ARM64 validator, whose post-build self-test cannot run
            # on the x64 GitHub Actions host.
            $targets = @(
              'LVSEqualizer', 'LVSCompressor', 'LVSDelay', 'LVSReverb',
              'LVSLimiter', 'LVSClipper', 'LVSDeEsser', 'LVSGate',
              'LVSChorus', 'LVSStereoWidth', 'LVSSaturation', 'LVSTape',
              'LVSDoubler', 'LVSFilter', 'LVSTremolo', 'LVSAutoPan',
              'LVSExciter', 'LVSDistortion', 'LVSVocalLeveler', 'LVSEnsemble',
              'LVSPitchDelay', 'LVSRingModulator', 'LVSLoFi', 'LVSGuitarAmp'
            )
            & cmake --build $buildRoot --config Release --target @targets --parallel
          } else {
            & cmake --build $buildRoot --config Release --parallel
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and validate Windows VST3 suite
        shell: pwsh
        run: |
          $buildRoot = "build/lvs-plugins-${{ matrix.arch }}"
          $packageRoot = "dist/${{ matrix.arch }}/package"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          $plugins = Get-ChildItem -Path $buildRoot -Recurse -Directory -Filter 'LVS*.vst3' |
            Group-Object Name |
            ForEach-Object { $_.Group | Select-Object -First 1 } |
            Sort-Object Name

          if ($plugins.Count -ne 24) {
            Write-Host "Found $($plugins.Count) LVS VST3 bundles:"
            $plugins | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "Expected exactly 24 LVS VST3 bundles"
          }

          foreach ($plugin in $plugins) {
            Copy-Item -Path $plugin.FullName -Destination $packageRoot -Recurse
            Write-Host "Collected $($plugin.Name)"
          }

          Copy-Item -Path lvs-plugins/THIRD_PARTY_NOTICES.md -Destination $packageRoot

          function Get-PeMachine([string] $path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 256) { throw "File is too small to be a PE: $path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) { throw "Invalid PE header: $path" }
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }

          $expectedMachine = [Convert]::ToUInt16("${{ matrix.pe_machine }}", 16)
          $pluginBinaries = Get-ChildItem -Path $packageRoot -Recurse -File -Filter '*.vst3'
          if ($pluginBinaries.Count -ne 24) {
            Write-Host "Found $($pluginBinaries.Count) VST3 PE binaries:"
            $pluginBinaries | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Expected exactly 24 VST3 PE binaries"
          }

          foreach ($binary in $pluginBinaries) {
            $machine = Get-PeMachine $binary.FullName
            Write-Host "$($binary.Name): PE machine 0x$($machine.ToString('X4'))"
            if ($machine -ne $expectedMachine) {
              throw "$($binary.FullName) has PE machine 0x$($machine.ToString('X4')); expected 0x${{ matrix.pe_machine }} for ${{ matrix.arch }}"
            }
          }

          Compress-Archive -Path "$packageRoot/*" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force

      - name: Upload Windows VST3 suite
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish-pr-test:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build-windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x64 and ARM64 packages
        uses: actions/download-artifact@v4
        with:
          pattern: LVS-Audio-Suite-Windows-*
          path: dist
          merge-multiple: true

      - name: Publish PR test pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseTag = (Get-Content ".github/LVS_RELEASE_TAG" -Raw).Trim()
          $tag = "$baseTag-pr${{ github.event.pull_request.number }}-test"
          $sha = "${{ github.event.pull_request.head.sha }}"
          $title = "LVS Audio Suite PR #${{ github.event.pull_request.number }} test"
          $notes = "Automated Windows x64 + ARM64 test build containing all 24 LVS VST3 effects from PR #${{ github.event.pull_request.number }} at commit $sha. Pre-release for manual LVS/VST3 smoke testing only. ARM64 is cross-compiled; Steinberg validator/moduleinfo generation is disabled for that artifact because the CI host is x64."

          $assets = @(
            "dist/LVS-Audio-Suite-Windows-x64.zip",
            "dist/LVS-Audio-Suite-Windows-arm64.zip"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing expected release asset: $asset" }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/$tag" -f sha="$sha" -F force=true
            gh release upload $tag @assets --clobber
            gh release edit $tag --prerelease --title $title --notes $notes
          } else {
            gh release create $tag @assets --target $sha --prerelease --title $title --notes $notes
          }
