name: LVS Plugins - Windows Build

# Temporary development-safe trigger. This workflow lives on the default branch
# so PR validation is reliable, but it only runs when lvs-plugins/.ci-trigger is
# touched. The feature PR will replace this with normal source-path CI once green.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lvs-plugins/.ci-trigger'

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S lvs-plugins -B build/lvs-plugins
          -G "Visual Studio 17 2022" -A x64
          -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build Release
        run: >-
          cmake --build build/lvs-plugins --config Release
          --target LVSEqualizer LVSCompressor LVSDelay LVSReverb --parallel

      - name: Collect VST3 bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $names = @(
            'LVSEqualizer.vst3',
            'LVSCompressor.vst3',
            'LVSDelay.vst3',
            'LVSReverb.vst3'
          )
          foreach ($name in $names) {
            $plugin = Get-ChildItem -Path build/lvs-plugins -Recurse -Directory -Filter $name | Select-Object -First 1
            if (-not $plugin) { throw "$name was not produced" }
            Copy-Item -Path $plugin.FullName -Destination dist -Recurse
          }

      - name: Upload Windows VST3 suite
        uses: actions/upload-artifact@v4
        with:
          name: LVS-Essentials-Windows-x64
          path: |
            dist/LVSEqualizer.vst3
            dist/LVSCompressor.vst3
            dist/LVSDelay.vst3
            dist/LVSReverb.vst3
          if-no-files-found: error
